apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-ecommerce
  namespace: argocd
  labels:
    app.kubernetes.io/name: nexus-ecommerce
    app.kubernetes.io/part-of: nexus-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.fsoft-academy.edu.vn/nexus/nexus-ecommerce.git
    targetRevision: HEAD
    path: devops/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
