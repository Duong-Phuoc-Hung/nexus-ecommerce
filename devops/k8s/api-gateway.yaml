apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nexus
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: nexus-platform
    app.kubernetes.io/component: gateway
    app: api-gateway
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: nexus-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: git.fsoft-academy.edu.vn:5050/nexus/nexus-ecommerce/api-gateway:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: PORT
              value: "4000"
            - name: GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: GATEWAY_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: NODE_ENV
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: USER_SERVICE_URL
            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: CATALOG_SERVICE_URL
            - name: COMMERCE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: COMMERCE_SERVICE_URL
            - name: AUCTION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: AUCTION_SERVICE_URL
            - name: FULFILLMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: FULFILLMENT_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: NOTIFICATION_SERVICE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nexus
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: nexus-platform
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
  selector:
    app: api-gateway
