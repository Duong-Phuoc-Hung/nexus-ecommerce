apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-service
  namespace: nexus
  labels:
    app.kubernetes.io/name: auction-service
    app.kubernetes.io/part-of: nexus-platform
    app.kubernetes.io/component: domain-service
    app: auction-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auction-service
  template:
    metadata:
      labels:
        app: auction-service
        app.kubernetes.io/name: auction-service
        app.kubernetes.io/part-of: nexus-platform
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: auction-service
          image: git.fsoft-academy.edu.vn:5050/nexus/nexus-ecommerce/auction-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 4004
              protocol: TCP
          env:
            - name: PORT
              value: "4004"
            - name: AUCTION_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: AUCTION_SERVICE_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secret
                  key: AUCTION_DB_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secret
                  key: REDIS_URL
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: REDIS_PORT
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secret
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: auction-service
  namespace: nexus
  labels:
    app.kubernetes.io/name: auction-service
    app.kubernetes.io/part-of: nexus-platform
    app: auction-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4004
      targetPort: http
      protocol: TCP
  selector:
    app: auction-service
