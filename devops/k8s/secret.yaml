apiVersion: v1
kind: Secret
metadata:
  name: nexus-secret
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus-secret
    app.kubernetes.io/part-of: nexus-platform
type: Opaque
stringData:
  # JWT Secrets (SRS 3.1 & 4.1)
  JWT_ACCESS_SECRET: "nexus_super_secret_jwt_access_token_min_32_characters_prod"
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_SECRET: "nexus_super_secret_jwt_refresh_token_min_32_characters_prod"
  JWT_REFRESH_EXPIRES_IN: "7d"

  # Isolated PostgreSQL Database URLs (SRS 4.1 - No Shared DB Principle)
  USER_DB_URL: "postgresql://nexus_user:nexus_password@nexus-postgres-user:5432/nexus_user_db"
  CATALOG_DB_URL: "postgresql://nexus_catalog:nexus_password@nexus-postgres-catalog:5432/nexus_catalog_db"
  COMMERCE_DB_URL: "postgresql://nexus_commerce:nexus_password@nexus-postgres-commerce:5432/nexus_commerce_db"
  AUCTION_DB_URL: "postgresql://nexus_auction:nexus_password@nexus-postgres-auction:5432/nexus_auction_db"
  FULFILLMENT_DB_URL: "postgresql://nexus_fulfillment:nexus_password@nexus-postgres-fulfillment:5432/nexus_fulfillment_db"
  NOTIFICATION_DB_URL: "postgresql://nexus_notification:nexus_password@nexus-postgres-notification:5432/nexus_notification_db"

  # Redis Authentication
  REDIS_PASSWORD: ""
  REDIS_URL: "redis://nexus-redis:6379"

  # RabbitMQ Credentials
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  RABBITMQ_URL: "amqp://guest:guest@nexus-rabbitmq:5672"

  # Third-party Integrations
  STRIPE_SECRET_KEY: "sk_test_replace_with_prod_stripe_secret_key"
  STRIPE_WEBHOOK_SECRET: "whsec_replace_with_prod_stripe_webhook_secret"
