apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - api-gateway.yaml
  - user-service.yaml
  - catalog-service.yaml
  - commerce-service.yaml
  - auction-service.yaml
  - fulfillment-service.yaml
