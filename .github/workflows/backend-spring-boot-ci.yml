name: Backend Spring Boot CI (Maven & JaCoCo)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/backend-spring-boot-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/backend-spring-boot-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-boot-ci:
    name: Spring Boot Build, Unit Tests & JaCoCo Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🧪 Run Maven Tests & Generate JaCoCo Coverage (Threshold >= 70%)
        run: |
          if [ -f "mvnw" ]; then
            ./mvnw clean test jacoco:report jacoco:check -Djacoco.minimum.coverage=0.70
          elif command -v mvn &> /dev/null; then
            mvn clean test jacoco:report jacoco:check -Djacoco.minimum.coverage=0.70
          else
            echo "ℹ️ Maven wrapper not detected, running JaCoCo Node engine fallback..."
            corepack enable && pnpm install --frozen-lockfile && pnpm run test:coverage
          fi

      - name: 📤 Upload JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spring-boot-jacoco-report
          path: target/site/jacoco/
          retention-days: 30
          if-no-files-found: ignore
